server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    open-ai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: "${AI_API_KEY}"
      base-url: https://api.siliconflow.cn

# JWT配置
jwt:
  secret: "${JWT_SECRET}"
  expiration: 86400000 # 24小时(毫秒)
  refresh-expiration: 604800000 #7天(毫秒)
  header: Authorization # token头部名称
  token-prefix: "Bearer " # token ff%